name: gacha_codex
description: A Flutter gacha app for selecting tickets and viewing prizes.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Cherry/
    - assets/images/Cinamoroll_2607/
    - assets/images/advent/exterior.png
    - assets/images/advent/window_light.png
    - assets/images/advent/closed_door.png
    - assets/images/advent/open_door.png
    - assets/images/advent/bread.png
    - assets/images/advent/wreath.png
