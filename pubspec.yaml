name: gacha_codex
description: A Flutter gacha app for selecting tickets and viewing prizes.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/prize_A.png
    - assets/images/prize_B.png
    - assets/images/prize_C.png
    - assets/images/prize_D.png
    - assets/images/prize_E.png
    - assets/images/prize_F.png
    - assets/images/prize_G.png
    - assets/images/ticket_opened_A.png
    - assets/images/ticket_opened_B.png
    - assets/images/ticket_opened_C.png
    - assets/images/ticket_opened_D.png
    - assets/images/ticket_opened_E.png
    - assets/images/ticket_opened_F.png
    - assets/images/ticket_opened_G.png
    - assets/images/ticket_unopened.png
    - assets/images/Cherry/
    - assets/images/Cinamoroll_2607/
    - assets/images/advent/Viliage_Day0.png
    - assets/images/advent/Day1_Bakery Show Window.png
    - assets/images/advent/Day02_Attic_Window.png
    - assets/images/advent/Day12_Walking_Couple.png
